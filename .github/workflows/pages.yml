name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Wait for github-pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const run_id = context.runId
            const deadline = Date.now() + 120000
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
            while (Date.now() < deadline) {
              const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id, per_page: 100 })
              const gh = arts.filter((a) => a.name === 'github-pages')
              if (gh.length > 1) {
                for (const a of gh.slice(0, -1)) await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id })
              }
              if (gh.length >= 1) {
                core.info('github-pages artifact ready (' + gh.length + ', ' + gh[gh.length-1].size_in_bytes + ' bytes); settling 20s')
                await sleep(20000)
                return
              }
              await sleep(5000)
            }
            core.setFailed('github-pages artifact did not register within 120s')
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy to GitHub Pages (retry once)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Fail if both deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
